global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/drift_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "model-serving"
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 4s
    dns_sd_configs:
      - names:
          - model-serving
        type: A
        port: 8080
        refresh_interval: 5s
